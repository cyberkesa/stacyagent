name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build core
        run: swift build --target StacyAgentCore
      - name: Test core
        run: swift test --filter StacyAgentCoreTests
      - name: Build agent
        run: swift build -c release
